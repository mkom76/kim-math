name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      operation:
        description: Deployment or read-only handwritten-solution preflight
        type: choice
        default: deploy
        options:
          - deploy
          - omr-diagnostics
          - notebook-preflight
          - notebook-prepare
          - notebook-activate
          - notebook-verify
          - homework-pdf-preflight
          - homework-pdf-migrate
          - homework-pdf-activate
          - homework-pdf-verify
          - homework-pdf-backup
          - homework-pdf-exam-migrate
          - homework-pdf-exam-verify
      expected_server_sha:
        description: Expected current server commit for the read-only preflight
        type: string
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/kim-math

jobs:
  omr-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'omr-diagnostics' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Read redacted OMR error metadata only
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            python3 - <<'PY'
            import collections, json, re, subprocess
            def run(args):
                return subprocess.run(args, capture_output=True, text=True, timeout=45)
            revision = run(['git','-C','/home/suhui/kim-math','rev-parse','HEAD'])
            print('server_revision=' + revision.stdout.strip() if revision.returncode == 0 else 'server_revision_unavailable')
            for container in ['kim-math-backend','kim-math-frontend']:
                result = run(['docker','inspect','--format','{{index .Config.Labels "org.opencontainers.image.revision"}}',container])
                print(container + '_image_revision=' + result.stdout.strip() if result.returncode == 0 else container + '_inspect_unavailable')
            result = run(['docker','logs','--since','6h','--tail','10000','kim-math-backend'])
            print('backend_log_read_exit=' + str(result.returncode))
            counts = collections.Counter()
            for line in (result.stdout + '\n' + result.stderr).splitlines():
                # Only class names, application stack frames and whitelisted diagnostics.
                for value in re.findall(r'\b(?:[a-zA-Z_$][\w$]*\.)+[A-Za-z_$][\w$]*(?:Exception|Error)\b', line):
                    counts['exception:' + value] += 1
                match = re.search(r'at (com\.example\.[A-Za-z0-9_.$]+\([A-Za-z0-9_.]+:\d+\))',line)
                if match: counts['frame:' + match.group(1)] += 1
                match = re.search(r"Request method '(GET|POST|PUT|DELETE|PATCH)' is not supported",line)
                if match: counts['unsupported_method:' + match.group(1)] += 1
                match = re.search(r'SQLState: ([A-Z0-9]+)',line)
                if match: counts['sqlstate:' + match.group(1)] += 1
                match = re.search(r"Unknown column '([A-Za-z0-9_.]+)'",line)
                if match: counts['unknown_column:' + match.group(1)] += 1
            print(json.dumps(counts, sort_keys=True))
            result = run(['docker','logs','--since','6h','--tail','20000','kim-math-nginx'])
            statuses = collections.Counter()
            for line in (result.stdout + '\n' + result.stderr).splitlines():
                match = re.search(r'"(GET|POST|PUT) /api/tests/\d+/omr/(scan|submissions/\d+(?:/review)?) HTTP/[^\"]+" (\d{3})',line)
                if match: statuses[match.group(1) + ' ' + re.sub(r'\d+','[id]',match.group(2)) + ' ' + match.group(3)] += 1
            print('omr_http_statuses=' + json.dumps(statuses,sort_keys=True))
            PY

  build-and-push:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notebook-preflight:
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.operation, 'notebook-') && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: notebook-production-operations
      cancel-in-progress: false
    env:
      NOTEBOOK_OPERATION: ${{ inputs.operation }}
      NOTEBOOK_EXPECTED_SERVER_SHA: ${{ inputs.expected_server_sha }}
      NOTEBOOK_SOURCE_SHA: ${{ github.sha }}
      NOTEBOOK_REF1_A: ${{ secrets.NOTEBOOK_TRANSFER_REF1_A }}
      NOTEBOOK_REF1_B: ${{ secrets.NOTEBOOK_TRANSFER_REF1_B }}
      NOTEBOOK_REF2: ${{ secrets.NOTEBOOK_TRANSFER_REF2 }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate expected revision and prepare operation script
        id: notebook-script
        shell: bash
        run: |
          [[ "$NOTEBOOK_EXPECTED_SERVER_SHA" =~ ^[a-f0-9]{40}$ ]]
          script_file=scripts/notebook-production-preflight.sh
          if [[ "$NOTEBOOK_OPERATION" != notebook-preflight ]]; then
            script_file=scripts/notebook-production-ops.sh
          fi
          bash -n "$script_file"
          delimiter="SCRIPT_$(openssl rand -hex 16)"
          {
            echo "script<<$delimiter"
            cat "$script_file"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - name: Run selected notebook operation without database changes
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 3m
          envs: NOTEBOOK_OPERATION,NOTEBOOK_EXPECTED_SERVER_SHA,NOTEBOOK_SOURCE_SHA,NOTEBOOK_REF1_A,NOTEBOOK_REF1_B,NOTEBOOK_REF2
          script: ${{ steps.notebook-script.outputs.script }}

  homework-pdf-operations:
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.operation, 'homework-pdf-') && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: homework-pdf-production-operations
      cancel-in-progress: false
    env:
      HOMEWORK_PDF_OPERATION: ${{ inputs.operation }}
      HOMEWORK_PDF_EXPECTED_SERVER_SHA: ${{ inputs.expected_server_sha }}
      HOMEWORK_PDF_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate operation and prepare reviewed script
        id: homework-pdf-script
        shell: bash
        run: |
          [[ "$HOMEWORK_PDF_EXPECTED_SERVER_SHA" =~ ^[a-f0-9]{40}$ ]]
          python3 -m py_compile scripts/homework-pdf-production.py
          python3 -m unittest discover -s scripts/tests -p 'test_homework_pdf_production.py'
          delimiter="SCRIPT_$(openssl rand -hex 16)"
          {
            echo "script<<$delimiter"
            echo "python3 - <<'HOMEWORK_PDF_PY'"
            cat scripts/homework-pdf-production.py
            echo HOMEWORK_PDF_PY
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - name: Run owner-authorized PDF homework operation
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 12m
          envs: HOMEWORK_PDF_OPERATION,HOMEWORK_PDF_EXPECTED_SERVER_SHA,HOMEWORK_PDF_SOURCE_SHA
          script: ${{ steps.homework-pdf-script.outputs.script }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/suhui/kim-math

            # Pull latest code
            git pull origin main

            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            docker-compose -f docker-compose.prod.yml pull

            # Restart services
            docker-compose -f docker-compose.prod.yml up -d

            # Clean up old images
            docker image prune -af

            echo "Deployment completed successfully!"
