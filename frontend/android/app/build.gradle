apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseSigningKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def releaseSigningConfigured = keystorePropertiesFile.exists() &&
    releaseSigningKeys.every { keystoreProperties.getProperty(it)?.trim() }
def releaseKeystoreFile = releaseSigningConfigured
    ? rootProject.file(keystoreProperties.getProperty('storeFile'))
    : null
releaseSigningConfigured = releaseSigningConfigured && releaseKeystoreFile.exists()

android {
    namespace = "com.kimmath.student"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.kimmath.student"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.0.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile releaseKeystoreFile
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
}

tasks.register('verifyReleaseSigning') {
    doLast {
        if (!releaseSigningConfigured) {
            throw new GradleException(
                'Play release signing is not configured. Copy ' +
                'frontend/android/keystore.properties.example to keystore.properties ' +
                'and point it at the backed-up upload keystore.'
            )
        }
    }
}

afterEvaluate {
    tasks.named('bundleRelease').configure {
        dependsOn 'verifyReleaseSigning'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// --- Auto-build web assets for Android builds --------------------------------
// Debug runs use the local backend through adb reverse. Release bundles use the
// dedicated Android mode so the packaged WebView calls the public HTTPS API.
def frontendDir = file("${rootProject.projectDir}/..")
def isReleaseBuild = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}

tasks.register('buildWebAssets', Exec) {
    workingDir frontendDir
    // Wrap in a login shell so Android Studio (launched from Dock) inherits the
    // user's PATH and can find node/npx/nvm.
    commandLine 'bash', '-lc',
        isReleaseBuild
            ? 'npm run build:android && npx cap copy android'
            : 'npx vite build --mode development && npx cap copy android'
}

// Tunnel the emulator's localhost:8080 to the host backend so app + API share
// the `localhost` site (required for the session cookie). Lost on emulator
// reboot, so re-established on every debug run. No-op / harmless if no device.
tasks.register('adbReverse', Exec) {
    onlyIf { !isReleaseBuild }
    commandLine "${android.getSdkDirectory()}/platform-tools/adb",
        'reverse', 'tcp:8080', 'tcp:8080'
    ignoreExitValue true
}

preBuild.dependsOn 'buildWebAssets', 'adbReverse'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
